name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOCK_MODE: "true"
      AGENT_ENABLE_SANDBOX: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q agent api experiments
      - run: python test/test_agent.py
      - run: python test/test_langgraph_agent.py
      - run: python test/test_dataset_loader.py
      - run: python test/test_web_app.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-plugin/package-lock.json
      - run: npm ci
        working-directory: vscode-plugin
      - run: npm test
        working-directory: vscode-plugin
